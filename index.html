const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const e=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.i)},key,ub(D.c));
  return new TextDecoder().decode(pt);
}
async function show(pw,remember){
  const html=await open_(pw);
  try{ if(remember) localStorage.setItem('bh_eco_pw',pw); }catch(e){}
  document.open(); document.write(html); document.close();
}
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async ev=>{ev.preventDefault();err.textContent='';go.disabled=true;go.textContent='Тексерілуде...';
  try{await show(document.getElementById('pw').value,document.getElementById('rm').checked);}
  catch(e){err.textContent='Құпиясөз қате. Қайта көріңіз.';go.disabled=false;go.textContent='Кіру';}
});
(async()=>{let s=null;try{s=localStorage.getItem('bh_eco_pw')}catch(e){}
  if(s){try{await show(s,true)}catch(e){try{localStorage.removeItem('bh_eco_pw')}catch(_){}}}})();
